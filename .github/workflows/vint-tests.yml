name: Vint Tests

on:
  pull_request:

jobs:
  test-vint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build verilator libgtest-dev libboost-dev

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja

      - name: Build vint tests
        run: cmake --build build --target test_vint

      - name: Run vint tests
        run: ctest --test-dir build --output-on-failure -R VintTests
